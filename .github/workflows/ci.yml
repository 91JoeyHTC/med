name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web (lint・typecheck・test・build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/sync-spec.mjs
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  engine:
    name: engine (pytest 金標)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  api:
    name: api (typecheck・build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  spec-consistency:
    name: spec 三端一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node apps/web/scripts/sync-spec.mjs
      - run: node scripts/check-spec-consistency.mjs
